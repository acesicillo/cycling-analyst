name: 🚴 Daily Cycling Dashboard

on:
  schedule:
    - cron: '0 6 * * *'   # 6:00 UTC = 7:00 CET / 8:00 CEST (Spain)
  workflow_dispatch:        # run manually anytime from GitHub Actions tab

jobs:
  build-dashboard:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # needed to commit index.html back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch data & build dashboard
        env:
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: python fetch_and_build.py

      - name: Commit & push updated dashboard
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "🚴 Dashboard updated $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
